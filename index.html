<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Ultimatum</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="heart-rain-container"></div>

    <div class="glass-card">
        <div id="status-bar">🔒 Emotional Lockdown: Active</div>
        
        <div id="main-content">
            <video class="vibe-video" src="Reply me love.mp4" autoplay muted loop playsinline></video>
            <h1 id="question">Will you be my Valentine? 💖</h1>
            <div class="controls">
                <button id="yesBtn" class="btn yes-btn">YES! 😍</button>
                <button id="noBtn" class="btn no-btn">No 😭</button>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <video class="vibe-video" src="Love me.mp4" autoplay loop playsinline></video>
            <h1 class="victory-text">VICTORY! <br> I knew you'd buckle! Ishika 🌸 💘</h1>
            
        </div>
    </div>
<script>
  const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const glassCard = document.querySelector('.glass-card');
const mainContent = document.getElementById('main-content');
const successScreen = document.getElementById('success-screen');
const rainContainer = document.getElementById('heart-rain-container');

let rejectionCount = 0;

// Function to drop hearts
function dropHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = ['❤️', '💖', '💘', '🌸'][Math.floor(Math.random() * 4)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
    rainContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}

// Start with light rain
setInterval(dropHeart, 500);

noBtn.addEventListener('click', () => {
    rejectionCount++;
    
    // 1. Shake the card
    glassCard.classList.add('shake');
    setTimeout(() => glassCard.classList.remove('shake'), 300);

    // 2. Make Yes Button bigger (Aggressively)
    let newScale = 1 + (rejectionCount * 0.4);
    yesBtn.style.transform = `scale(${newScale})`;
    
    // 3. Make No Button smaller and move it
    let noScale = 1 - (rejectionCount * 0.1);
    noBtn.style.transform = `scale(${Math.max(noScale, 0.3)}) translate(${Math.random()*50}px, ${Math.random()*50}px)`;

    // 4. THE IRRITATING PART: Increase Heart Rain density
    for(let i=0; i<5; i++) { dropHeart(); }

    // 5. Change Text
    const texts = ["Really?", "Are you sure?", "You're joking, right?", "Click the big one!", "JUST SAY YES"];
    document.getElementById('question').innerText = texts[Math.min(rejectionCount, texts.length-1)];
});

yesBtn.addEventListener('click', () => {
    mainContent.classList.add('hidden');
    successScreen.classList.remove('hidden');
    // Final heart explosion
    for(let i=0; i<50; i++) { setTimeout(dropHeart, i*50); }
});
</script>
    <script src="script.js"></script>
</body>
</html>
